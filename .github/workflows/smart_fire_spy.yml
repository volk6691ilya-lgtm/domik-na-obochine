name: Smart Fire Spy Monitor

on:
  schedule:
    # Запускается каждые 15 минут
    - cron: '*/15 * * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  smart-fire-spy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests yfinance feedparser
          
      # 🧠 ВОССТАНАВЛИВАЕМ файл last_signals.json из кэша
      - name: Restore last signals
        uses: actions/cache@v3
        with:
          path: last_signals.json
          key: ${{ runner.os }}-last-signals
          restore-keys: |
            ${{ runner.os }}-last-signals
          
      - name: Run Smart Fire Spy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python smart_fire_spy.py
          
      # 💾 actions/cache автоматически сохранит обновленный last_signals.json
