name: Fire Spy Main Run

on:
  schedule:
    # 09:12 и 21:12 МСК (UTC = МСК - 3 часа). Сдвиг на 12 мин помогает избежать очередей GitHub.
    - cron: '12 6,18 * * *'
  workflow_dispatch:

jobs:
  run-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance requests feedparser pandas matplotlib
      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
