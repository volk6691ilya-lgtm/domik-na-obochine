name: Fire Spy Main Run

on:
  schedule:
    # 09:00 по Москве (06:00 UTC)
    - cron: '0 6 * * *'
    # 21:00 по Москве (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:  # Позволяет запускать вручную кнопкой для теста

jobs:
  run-main-analyst:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install yfinance requests feedparser pandas matplotlib
          
      - name: Run Main Analyst
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ERROR_CHANNEL_ID: ${{ secrets.TELEGRAM_ERROR_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python main.py
