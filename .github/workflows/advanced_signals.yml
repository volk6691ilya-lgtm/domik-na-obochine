name: Advanced Trading Signals (Moon Watch v2.1)

on:
  schedule:
    # Запускаем каждый час для точности ±1 час
    - cron: '0 * * * *'
  workflow_dispatch:  # Ручной запуск для тестов

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # ⏰ ПРОВЕРКА ВРЕМЕНИ (занимает ~2 секунды)
      - name: Check if it's time for signals
        id: timecheck
        run: |
          HOUR=$(TZ='Europe/Moscow' date +%H)
          if [[ "$HOUR" = "01" || "$HOUR" = "05" || "$HOUR" = "10" || "$HOUR" = "15" || "$HOUR" = "20" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Время сигнала: ${HOUR}:00 МСК"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏸️ Сейчас ${HOUR}:00 МСК — не время для сигнала"
          fi
        
      - name: Set up Python
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        if: steps.timecheck.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv yfinance feedparser pandas matplotlib ta scipy mplfinance
          
      #  ВОССТАНАВЛИВАЕМ last_signals.json из кэша (чтобы проверять дубликаты)
      - name: Restore last signals
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/cache@v3
        with:
          path: last_signals.json
          key: ${{ runner.os }}-last-signals
          restore-keys: |
            ${{ runner.os }}-last-signals
          
      - name: Run Signal Generator
        if: steps.timecheck.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python signal_generator.py
          
      # 💾 Сохраняем обновленный last_signals.json в кэш (для Умного Пожарного Бота)
      - name: Save last signals
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/cache/save@v3
        with:
          path: last_signals.json
          key: ${{ runner.os }}-last-signals
