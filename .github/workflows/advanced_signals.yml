name: Advanced Trading Signals (Moon Watch v2.1)

on:
  schedule:
    # 7 раз в день. UTC = МСК минус 3 часа.
    # 02:00 МСК = 23:00 UTC (пред. дня)
    # 06:00 МСК = 03:00 UTC
    # 11:00 МСК = 08:00 UTC
    # 15:00 МСК = 12:00 UTC
    # 19:00 МСК = 16:00 UTC
    # 22:00 МСК = 19:00 UTC
    # 23:00 МСК = 20:00 UTC
    - cron: '0 23,3,8,12,16,19,20 * * *'
  workflow_dispatch:

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv yfinance feedparser pandas matplotlib ta scipy mplfinance
          
      - name: Restore last signals
        uses: actions/cache@v3
        with:
          path: last_signals.json
          key: ${{ runner.os }}-last-signals
          restore-keys: |
            ${{ runner.os }}-last-signals
          
      - name: Run Signal Generator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python signal_generator.py
          
      - name: Save last signals
        uses: actions/cache/save@v3
        with:
          path: last_signals.json
          key: ${{ runner.os }}-last-signals
