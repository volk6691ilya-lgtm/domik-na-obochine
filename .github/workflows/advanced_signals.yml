name: Advanced Trading Signals

on:
  schedule:
    # 02:00, 06:00, 11:00, 15:00, 19:00, 22:00, 23:00 МСК (UTC = МСК - 3 часа)
    - cron: '0 23,3,8,12,16,19,20 * * *'
  workflow_dispatch:

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv yfinance feedparser pandas matplotlib ta scipy mplfinance
      - uses: actions/cache@v3
        with:
          path: last_signals.json
          key: ${{ runner.os }}-last-signals
          restore-keys: |
            ${{ runner.os }}-last-signals
      - run: python signal_generator.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      - uses: actions/cache/save@v3
        with:
          path: last_signals.json
          key: ${{ runner.os }}-last-signals
