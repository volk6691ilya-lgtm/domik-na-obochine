name: Advanced Trading Signals (Moon Watch v2.1)

on:
  schedule:
        # Запускается 5 раз в сутки: 01:00, 05:00, 10:00, 15:00, 20:00 МСК
    # В UTC это: 22:00 (пред. дня), 02:00, 07:00, 12:00, 17:00
    - cron: '0 22,2,7,12,17 * * *'
  workflow_dispatch:  # Ручной запуск для тестов

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv yfinance feedparser pandas matplotlib ta scipy mplfinance
          
      - name: Run Signal Generator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python signal_generator.py
