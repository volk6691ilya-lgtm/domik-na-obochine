name: Fire Spy Alert System

on:
  schedule:
    # Запускается каждые 15 минут
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Ручной запуск

jobs:
  fire-spy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install yfinance requests feedparser matplotlib pandas
          
      # 🧠 НОВОЕ: Восстанавливаем файл памяти из кэша перед запуском
      - name: Restore spy state
        uses: actions/cache@v3
        with:
          path: spy_state.json
          key: ${{ runner.os }}-spy-state
          restore-keys: |
            ${{ runner.os }}-spy-state
          
      - name: Run Fire Spy Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} # Добавлено: нужно для ИИ-анализа причин
        run: |
          python fire_spy_alert.py
          
      # 💾 actions/cache автоматически сохранит обновленный spy_state.json в конце запуска, 
      # если скрипт его изменил (после успешного алерта).
